<p>
<small>
    tags:
    {% for tag in page.data.tags %}
        {% if loop.last %}
        <span><a href="/tags/{{ tag }}.html">{{ tag | replace('_', ' ') }}</a></span>
        {% else %}
        <span><a href="/tags/{{ tag }}.html">{{ tag | replace('_', ' ') }},</a></span>
        {% endif %}
    {% endfor %}
</small>
</p>
