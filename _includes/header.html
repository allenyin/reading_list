<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.name }}</title>

  <script>
    (function () {
      // Check localStorage for a saved theme
      const savedTheme = localStorage.getItem('theme');

      // If the user has explicitly chosen the light theme, apply it
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      // By default, the dark theme from the CSS will be used.
    })();
  </script>

  {%- if analytics.isProduction and analytics.ga_id -%}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics.ga_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{ analytics.ga_id }}');
  </script>
  {%- endif -%}

  <link href="{{ '/css/theme.css' | url }}" rel="stylesheet">
  <link href="{{ '/css/prism-custom.css' | url }}" rel="stylesheet">
  <!-- Prism.js for syntax highlighting and line numbers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-core.min.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-matlab.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-nasm.min.js"></script>
  <!-- MathJax3 will be loaded by markdown-it-mathjax3 plugin -->
  <!-- MathJax3 will be loaded by markdown-it-mathjax3 plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-nasm.min.js"></script>
  <!-- Theme toggle JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const themeToggleBtn = document.querySelector('.theme-toggle-btn');

      // This function updates the button's text based on the current theme
      const updateButtonText = () => {
        // Check if the 'data-theme' attribute is 'light'
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';

        // Set the button text accordingly
        if (isLight) {
          themeToggleBtn.textContent = 'Dark 🌙';
        } else {
          themeToggleBtn.textContent = 'Light ☀️';
        }
      };

      // Add the click event listener to the button
      themeToggleBtn.addEventListener('click', function () {
        // Get the root <html> element
        const root = document.documentElement;

        // Check if the light theme is currently active by checking the attribute
        const isLight = root.getAttribute('data-theme') === 'light';

        if (isLight) {
          // Switch to DARK mode: remove the attribute and the localStorage item
          root.removeAttribute('data-theme');
          localStorage.removeItem('theme');
        } else {
          // Switch to LIGHT mode: set the attribute and the localStorage item
          root.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        }

        // After every click, update the button text to reflect the new theme
        updateButtonText();
      });

      // --- IMPORTANT ---
      // Set the initial button text when the page first loads
      updateButtonText();
    });
  </script>
</head>

<body>
  <nav class="navbar">
    <div class="navbar-content">
      <div class="navbar-brand">
        <a href="{{ '/' | url }}">{{ site.name }}</a>
      </div>
      <div class="navbar-menu">
        <a href="{{ '/' | url }}">Home</a>
        <a href="{{ '/archive/' | url }}">Archive</a>
        <a href="{{ '/tags/' | url }}">All Tags</a>
        {% if site.github %}
        <a href="https://github.com/{{ site.github }}">Github</a>
        {% endif %}
        <button id="theme-toggle" class="theme-toggle-btn">
          <span id="theme-icon">Dark</span>
        </button>
      </div>
    </div>
  </nav>
