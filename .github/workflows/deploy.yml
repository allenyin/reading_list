# .github/workflows/deploy.yml

name: Build and Deploy Eleventy Site

on:
  push:
    branches:
      - gh-pages # Or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js 18.x LTS 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm install

      - name: Build the site 🛠️
        # This is the updated command
        run: npm run build:prod
        env:
          GA_ID: ${{ secrets.GA_ID }}
          CUSDIS_APP_ID: ${{ secrets.CUSDIS_APP_ID }}

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@v4
