<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="thinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="directGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="340" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Explicit Mode Separation: Conditional Distributions</text>
  
  <!-- Dividing line -->
  <line x1="300" y1="50" x2="300" y2="250" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Left side: Direct Mode -->
  <rect x="85" y="55" width="200" height="25" rx="4" fill="#3498DB" opacity="0.2"/>
  <text x="185" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Direct Mode (no &lt;think&gt;)</text>
  
  <!-- Left axes -->
  <line x1="100" y1="220" x2="270" y2="220" stroke="#666" stroke-width="1.5"/>
  <line x1="100" y1="220" x2="100" y2="95" stroke="#666" stroke-width="1.5"/>
  
  <!-- Direct mode distribution -->
  <path d="M 110 220 
           Q 140 218 160 190 
           Q 180 150 200 115 
           Q 220 150 240 190 
           Q 260 218 270 220" 
        fill="url(#directGrad)" stroke="#3498DB" stroke-width="2.5"/>
  
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2980B9" font-weight="bold">Style Teacher</text>
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2980B9">Distribution</text>
  
  <!-- Right side: Thinking Mode -->
  <rect x="315" y="55" width="200" height="25" rx="4" fill="#9B59B6" opacity="0.2"/>
  <text x="415" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#8E44AD">&lt;think&gt; Mode</text>
  
  <!-- Right axes -->
  <line x1="330" y1="220" x2="500" y2="220" stroke="#666" stroke-width="1.5"/>
  <line x1="330" y1="220" x2="330" y2="95" stroke="#666" stroke-width="1.5"/>
  
  <!-- Thinking mode distribution -->
  <path d="M 340 220 
           Q 370 218 390 185 
           Q 410 140 430 105 
           Q 450 140 470 185 
           Q 490 218 500 220" 
        fill="url(#thinkGrad)" stroke="#9B59B6" stroke-width="2.5"/>
  
  <text x="430" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8E44AD" font-weight="bold">Reasoning Teacher</text>
  <text x="430" y="102" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8E44AD">Distribution</text>
  
  <!-- Token boundary annotation -->
  <text x="300" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7F8C8D" font-weight="bold">Token Boundary</text>
  <text x="300" y="278" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">separates distributions</text>
  
  <!-- Bottom explanation boxes -->
  <rect x="90" y="295" width="180" height="35" rx="5" fill="#EBF5FB" stroke="#3498DB" stroke-width="1"/>
  <text x="180" y="310" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2471A3">Student learns:</text>
  <text x="180" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2471A3">P(response | prompt, mode=direct)</text>
  
  <rect x="330" y="295" width="180" height="35" rx="5" fill="#F5EEF8" stroke="#9B59B6" stroke-width="1"/>
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7D3C98">Student learns:</text>
  <text x="420" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7D3C98">P(response | prompt, mode=think)</text>
  
  <!-- Checkmarks -->
  <text x="275" y="310" font-family="Arial, sans-serif" font-size="16" fill="#27AE60">✓</text>
  <text x="515" y="310" font-family="Arial, sans-serif" font-size="16" fill="#27AE60">✓</text>
  
  <!-- Small annotation -->
  <text x="300" y="338" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888" font-style="italic">No interpolation: each mode has clear, separate target distribution</text>
</svg>
