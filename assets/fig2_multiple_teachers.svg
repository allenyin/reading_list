<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="teacher1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="teacher2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="teacher3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Multiple Teachers: Multimodal Training Distribution</text>
  
  <!-- Axes -->
  <line x1="80" y1="240" x2="520" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="80" y1="240" x2="80" y2="60" stroke="#666" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Response Style Space</text>
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" transform="rotate(-90, 40, 150)">Probability Density</text>
  
  <!-- Teacher 1 distribution (left) -->
  <path d="M 100 240 
           Q 130 240 150 210 
           Q 170 160 190 120 
           Q 210 160 230 210 
           Q 250 240 280 240" 
        fill="url(#teacher1Grad)" stroke="#4A90D9" stroke-width="2"/>
  
  <!-- Teacher 2 distribution (center) -->
  <path d="M 220 240 
           Q 250 240 270 200 
           Q 290 150 310 110 
           Q 330 150 350 200 
           Q 370 240 400 240" 
        fill="url(#teacher2Grad)" stroke="#27AE60" stroke-width="2"/>
  
  <!-- Teacher 3 distribution (right) -->
  <path d="M 340 240 
           Q 380 240 400 210 
           Q 420 165 440 130 
           Q 460 165 480 210 
           Q 500 240 520 240" 
        fill="url(#teacher3Grad)" stroke="#9B59B6" stroke-width="2"/>
  
  <!-- Labels for peaks -->
  <text x="190" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4A90D9" font-weight="bold">Teacher A</text>
  <text x="310" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27AE60" font-weight="bold">Teacher B</text>
  <text x="440" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9B59B6" font-weight="bold">Teacher C</text>
  
  <!-- Legend -->
  <rect x="430" y="55" width="12" height="12" fill="#4A90D9" opacity="0.6"/>
  <text x="447" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333">Concise style</text>
  
  <rect x="430" y="73" width="12" height="12" fill="#27AE60" opacity="0.6"/>
  <text x="447" y="83" font-family="Arial, sans-serif" font-size="10" fill="#333">Balanced style</text>
  
  <rect x="430" y="91" width="12" height="12" fill="#9B59B6" opacity="0.6"/>
  <text x="447" y="101" font-family="Arial, sans-serif" font-size="10" fill="#333">Verbose style</text>
  
  <!-- Annotation -->
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888" font-style="italic">Each teacher has distinct stylistic patterns → multimodal training data</text>
</svg>
