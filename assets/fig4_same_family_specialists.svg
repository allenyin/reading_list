<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495E;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="spec1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="spec2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="spec3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="320" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Same-Family Specialists: Bounded Divergence</text>
  
  <!-- Axes -->
  <line x1="80" y1="240" x2="520" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="80" y1="240" x2="80" y2="60" stroke="#666" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="300" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Response Style Space</text>
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" transform="rotate(-90, 40, 150)">Probability Density</text>
  
  <!-- Base model distribution (wide, background) -->
  <path d="M 100 240 
           Q 160 238 210 210 
           Q 260 165 310 130 
           Q 360 165 410 210 
           Q 460 238 520 240" 
        fill="url(#baseGrad)" stroke="#34495E" stroke-width="2" stroke-dasharray="6,3"/>
  
  <!-- Specialist 1 (Math - slightly shifted left) -->
  <path d="M 140 240 
           Q 180 238 210 205 
           Q 240 160 270 125 
           Q 300 160 330 205 
           Q 360 238 400 240" 
        fill="url(#spec1Grad)" stroke="#3498DB" stroke-width="2"/>
  
  <!-- Specialist 2 (Code - center) -->
  <path d="M 180 240 
           Q 220 238 255 200 
           Q 290 150 320 115 
           Q 350 150 385 200 
           Q 420 238 460 240" 
        fill="url(#spec2Grad)" stroke="#2ECC71" stroke-width="2"/>
  
  <!-- Specialist 3 (Reasoning - slightly shifted right) -->
  <path d="M 220 240 
           Q 260 238 295 198 
           Q 330 145 365 110 
           Q 400 145 435 198 
           Q 470 238 500 240" 
        fill="url(#spec3Grad)" stroke="#E67E22" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="270" y="108" font-family="Arial, sans-serif" font-size="9" fill="#3498DB" font-weight="bold">Math</text>
  <text x="320" y="98" font-family="Arial, sans-serif" font-size="9" fill="#2ECC71" font-weight="bold">Code</text>
  <text x="365" y="93" font-family="Arial, sans-serif" font-size="9" fill="#E67E22" font-weight="bold">Reasoning</text>
  
  <!-- Base model label -->
  <text x="310" y="145" font-family="Arial, sans-serif" font-size="9" fill="#34495E">Base Model</text>
  
  <!-- Legend -->
  <line x1="420" y1="60" x2="440" y2="60" stroke="#34495E" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="447" y="64" font-family="Arial, sans-serif" font-size="9" fill="#333">Shared base</text>
  
  <rect x="420" y="73" width="15" height="10" fill="#3498DB" opacity="0.5"/>
  <text x="440" y="82" font-family="Arial, sans-serif" font-size="9" fill="#333">Math specialist</text>
  
  <rect x="420" y="88" width="15" height="10" fill="#2ECC71" opacity="0.5"/>
  <text x="440" y="97" font-family="Arial, sans-serif" font-size="9" fill="#333">Code specialist</text>
  
  <rect x="420" y="103" width="15" height="10" fill="#E67E22" opacity="0.5"/>
  <text x="440" y="112" font-family="Arial, sans-serif" font-size="9" fill="#333">Reasoning specialist</text>
  
  <!-- Annotation box -->
  <rect x="100" y="280" width="400" height="30" rx="5" fill="#E8F6E8" stroke="#27AE60" stroke-width="1"/>
  <text x="300" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1E8449">Specialists are perturbations of shared base → distributions overlap significantly</text>
  <text x="300" y="307" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1E8449">Interpolation stays within coherent region ✓</text>
</svg>
